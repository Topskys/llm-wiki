<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" font-family="'Source Han Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <radialGradient id="atmoT" cx="0.85" cy="0.12" r="0.78">
      <stop offset="0" stop-color="#0d3a66" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#0d3a66" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0d3a66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atmoT2" cx="0.1" cy="0.92" r="0.75">
      <stop offset="0" stop-color="#123a7a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#123a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGradTk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bcdcf8"/>
    </linearGradient>
    <marker id="arrTk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" fill-opacity="0.85"/>
    </marker>
  </defs>

  <!-- 蓝色偏底 -->
  <rect x="0" y="0" width="2560" height="1440" fill="#081426"/>
  <rect x="0" y="0" width="2560" height="1440" fill="url(#atmoT)"/>
  <rect x="0" y="0" width="2560" height="1440" fill="url(#atmoT2)"/>
  <g stroke="#122a45" stroke-width="1.5" opacity="0.95">
    <path d="M 200 0 V 1440 M 530 0 V 1440 M 860 0 V 1440 M 1190 0 V 1440 M 1520 0 V 1440 M 1850 0 V 1440 M 2180 0 V 1440 M 2510 0 V 1440"/>
    <path d="M 0 190 H 2560 M 0 510 H 2560 M 0 830 H 2560 M 0 1150 H 2560"/>
  </g>

  <text x="80" y="150" font-size="23" letter-spacing="4" fill="#6f95ad" font-weight="600">TOKENIZATION · BPE · WORDPIECE · UNIGRAM · SENTENCEPIECE</text>
  <text x="80" y="296" font-size="104" font-weight="bold" letter-spacing="4" fill="url(#titleGradTk)">Token 分词</text>
  <text x="80" y="384" font-size="35" fill="#c3d9ea" letter-spacing="1">把文本切成最小单元映射成 ID——词表大小与序列长度的平衡器，悄悄决定着算术、拼写与计费</text>
  <g font-size="26" fill="#8fb5d4">
    <rect x="80" y="448" width="220" height="56" rx="28" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="190" y="484" text-anchor="middle">BPE 主流</text>
    <rect x="320" y="448" width="220" height="56" rx="28" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="430" y="484" text-anchor="middle">词表 3 万~25 万</text>
    <rect x="560" y="448" width="220" height="56" rx="28" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="670" y="484" text-anchor="middle">BLT 无分词器</text>
  </g>

  <!-- 左侧主视觉：文本 → token 色块 → ID 序列 -->
  <text x="80" y="608" font-size="24" fill="#6f95ad" letter-spacing="3">TOKENIZE · 一句话的旅程</text>
  <text x="100" y="672" font-size="26" fill="#dbeafe">unimaginable often plays</text>
  <path d="M 640 664 H 700" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrTk)"/>
  <text x="720" y="672" font-size="26" fill="#dbeafe">un · imagin · able | often | play · s</text>
  <!-- token 色块 -->
  <g font-size="22" text-anchor="middle">
    <rect x="100"  y="710" width="80"  height="56" rx="8" fill="#1a3a5c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140"  y="746" fill="#7dd3fc">un</text>
    <rect x="188"  y="710" width="150" height="56" rx="8" fill="#123454" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="263"  y="746" fill="#93c5fd">imagin</text>
    <rect x="346"  y="710" width="92"  height="56" rx="8" fill="#1a3a5c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="392"  y="746" fill="#7dd3fc">able</text>
    <rect x="446"  y="710" width="130" height="56" rx="8" fill="#0f4266" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="511"  y="746" fill="#67e8f9">often</text>
    <rect x="584"  y="710" width="104" height="56" rx="8" fill="#1a3a5c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="636"  y="746" fill="#7dd3fc">play</text>
    <rect x="696"  y="710" width="70"  height="56" rx="8" fill="#123454" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="731"  y="746" fill="#93c5fd">s</text>
  </g>
  <path d="M 820 738 H 880" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrTk)"/>
  <text x="900" y="746" font-size="24" fill="#9fc3dd" font-family="Consolas,monospace">ID: [4912, 8834, 271, 7861, 15400, 82]</text>

  <!-- 中部：BPE 手算卡 -->
  <rect x="80" y="820" width="1180" height="290" rx="16" fill="#0b2340" fill-opacity="0.65" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
  <text x="120" y="876" font-size="26" fill="#7dd3fc" font-weight="600">BPE · 高频对迭代合并（手算算例）</text>
  <text x="120" y="930" font-size="22" fill="#aecbe4">low×5 · lower×2 · newest×6 · widest×3</text>
  <g font-size="22" fill="#aecbe4">
    <text x="120" y="982">第 1 轮 (e, s)→es　第 2 轮 (es, t)→est</text>
    <text x="120" y="1026">第 3 轮 (l, o)→lo　　第 4 轮 (lo, w)→low</text>
  </g>
  <text x="120" y="1078" font-size="24" fill="#67e8f9" font-family="Consolas,monospace">lowest → low + est</text>

  <!-- 右侧两卡 -->
  <rect x="1320" y="820" width="1160" height="135" rx="16" fill="#0b2340" fill-opacity="0.6" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="2"/>
  <text x="1360" y="872" font-size="25" fill="#93c5fd" font-weight="600">词表 · 3 万 → 25 万</text>
  <text x="1360" y="920" font-size="21" fill="#9db8d2">大词表序列短但嵌入参数翻倍 · BERT 3 万 / Llama 3 12.8 万 / o200k 约 20 万</text>

  <rect x="1320" y="975" width="1160" height="135" rx="16" fill="#0b2340" fill-opacity="0.6" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="2"/>
  <text x="1360" y="1027" font-size="25" fill="#fcd34d" font-weight="600">中文效率 · cl100k → o200k</text>
  <text x="1360" y="1075" font-size="21" fill="#d9c9a0">每汉字 1~2 个 token 降到约 0.5~0.75 · 计费与上下文占用随之下降</text>

  <!-- 底部收束条 -->
  <rect x="80" y="1250" width="2400" height="110" rx="16" fill="#0b2340" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="128" y="1300" font-size="26" fill="#d6e6f5" font-weight="600">词 → 字符 → 子词 → 字节，BPE 高频合并、WordPiece 似然增益、Unigram 反向删减——殊途同归解决词汇爆炸</text>
  <text x="128" y="1338" font-size="22" fill="#6f95ad">分词决定算术 · 拼写 · 计费 · 上下文 · 前沿的 BLT 正用熵驱动动态 patch 取消这道工序</text>
</svg>
