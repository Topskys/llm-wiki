<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="-74 -74 2708 1588" preserveAspectRatio="xMidYMid slice" font-family="'Source Han Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif">

  <!-- ================= 定义 ================= -->
  <defs>
    <radialGradient id="atmoBlue" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#1e3a5f" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#1e3a5f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atmoWarm" cx="0.86" cy="0.92" r="0.8">
      <stop offset="0" stop-color="#3a2a10" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#3a2a10" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3a2a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ddfa"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#4fc3f7" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fc3f7" fill-opacity="0.7"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55708f" fill-opacity="0.9"/>
    </marker>
  </defs>

  <!-- ================= 画布与背景（出血 -64px） ================= -->
  <rect x="-64" y="-64" width="2688" height="1568" fill="#0a1220"/>
  <rect x="-64" y="-64" width="2688" height="1568" fill="url(#atmoBlue)"/>
  <rect x="-64" y="-64" width="2688" height="1568" fill="url(#atmoWarm)"/>

  <!-- 工程网格线（1.5px / opacity 0.95） -->
  <g stroke="#16283f" stroke-width="1.5" opacity="0.95">
    <path d="M 176 -64 V 1504 M 416 -64 V 1504 M 656 -64 V 1504 M 896 -64 V 1504 M 1136 -64 V 1504 M 1376 -64 V 1504 M 1616 -64 V 1504 M 1856 -64 V 1504 M 2096 -64 V 1504 M 2336 -64 V 1504"/>
    <path d="M -64 176 H 2624 M -64 416 H 2624 M -64 656 H 2624 M -64 896 H 2624 M -64 1136 H 2624 M -64 1376 H 2624"/>
  </g>

  <!-- ================= 顶部标题区（边距 80） ================= -->
  <text x="80" y="168" font-size="23" letter-spacing="4" fill="#7c93ad" font-weight="600">TEST-TIME SCALING · THE THIRD SCALING AXIS</text>

  <!-- 主标题（无冒号） -->
  <text x="80" y="316" font-size="104" font-weight="bold" letter-spacing="4" fill="url(#titleGrad)">推理时扩展</text>

  <!-- 副标题 -->
  <text x="80" y="402" font-size="35" fill="#cbd5e1" letter-spacing="1">参数不变，按请求多花算力——重复采样、树搜索与验证器筛选，让推理算力部分替代参数规模</text>

  <!-- 三关键词徽标（描边统一） -->
  <g font-size="26" fill="#8fa6c4">
    <rect x="80" y="470" width="254" height="56" rx="28" fill="none" stroke="#4fc3f7" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="207" y="506" text-anchor="middle">重复采样覆盖率</text>
    <rect x="354" y="470" width="254" height="56" rx="28" fill="none" stroke="#4fc3f7" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="481" y="506" text-anchor="middle">过程奖励 PRM</text>
    <rect x="628" y="470" width="254" height="56" rx="28" fill="none" stroke="#4fc3f7" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="755" y="506" text-anchor="middle">按难度分配预算</text>
  </g>

  <!-- ================= 左侧内容块 1：覆盖率曲线卡 ================= -->
  <g>
    <rect x="80" y="580" width="900" height="230" rx="14" fill="#0e1c33" fill-opacity="0.55" stroke="#1c3352" stroke-width="1.5"/>
    <text x="112" y="630" font-size="24" letter-spacing="3" fill="#4fc3f7" font-weight="600">COVERAGE · 重复采样覆盖率</text>

    <!-- 迷你曲线图（基线 756） -->
    <line x1="112" y1="756" x2="560" y2="756" stroke="#1c3352" stroke-width="2"/>
    <path d="M 112 750 C 220 730, 330 690, 430 660 S 520 636, 560 632" fill="none" stroke="#4fc3f7" stroke-opacity="0.85" stroke-width="3"/>
    <line x1="400" y1="632" x2="560" y2="632" stroke="#e0b060" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="560" y="618" font-size="21" fill="#e0b060" text-anchor="end">验证上限</text>
    <text x="112" y="790" font-size="22" fill="#6e86a8">采样 250 次 · 15.9% → 56%（SWE-bench）</text>

    <!-- 右侧公式 -->
    <text x="612" y="694" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="34" fill="#dce8fa">coverage ≈ min(1, α·n<tspan font-size="22" dy="-10">β</tspan><tspan dy="10">)</tspan></text>
    <text x="612" y="742" font-size="22" fill="#7c93ad">对数线性增长</text>
    <text x="612" y="776" font-size="22" fill="#7c93ad">饱和后现验证差距</text>
  </g>

  <!-- ================= 左侧内容块 2：四方法 2×2 网格 ================= -->
  <g>
    <text x="80" y="892" font-size="24" letter-spacing="3" fill="#4fc3f7" font-weight="600">METHODS · 四类方法按算力结构划分</text>
    <g>
      <rect x="80" y="912" width="420" height="70" rx="12" fill="#0e1c33" fill-opacity="0.5" stroke="#1c3352" stroke-width="1.5"/>
      <text x="104" y="956" font-size="24"><tspan fill="#4fc3f7" font-weight="700">01</tspan><tspan fill="#8fa6c4" dx="10">串行 · 长思维链由 RL 内化</tspan></text>
      <rect x="520" y="912" width="460" height="70" rx="12" fill="#0e1c33" fill-opacity="0.5" stroke="#1c3352" stroke-width="1.5"/>
      <text x="544" y="956" font-size="24"><tspan fill="#4fc3f7" font-weight="700">02</tspan><tspan fill="#8fa6c4" dx="10">并行 · Best-of-N 与多数投票</tspan></text>
      <rect x="80" y="992" width="420" height="70" rx="12" fill="#0e1c33" fill-opacity="0.5" stroke="#1c3352" stroke-width="1.5"/>
      <text x="104" y="1036" font-size="24"><tspan fill="#4fc3f7" font-weight="700">03</tspan><tspan fill="#8fa6c4" dx="10">树搜索 · MCTS 加过程奖励</tspan></text>
      <rect x="520" y="992" width="460" height="70" rx="12" fill="#123252" fill-opacity="0.7" stroke="#4fc3f7" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="544" y="1036" font-size="24" fill="#dce8fa" font-weight="600"><tspan fill="#4fc3f7">04</tspan><tspan dx="10">自适应 · 按难度分配预算</tspan></text>
    </g>
    <text x="80" y="1100" font-size="24" fill="#6e86a8" letter-spacing="1">难度决定最优策略 · FLOPs 匹配下自适应可胜 14 倍大模型</text>
  </g>

  <!-- ================= 左侧内容块 3：过思考警示卡 ================= -->
  <g>
    <rect x="80" y="1130" width="900" height="120" rx="14" fill="#0e1c33" fill-opacity="0.45" stroke="#1c3352" stroke-width="1.5"/>
    <rect x="80" y="1130" width="5" height="120" fill="#e0b060"/>
    <text x="118" y="1177" font-size="27" fill="#e0b060" font-weight="600">过思考 边际收益递减</text>
    <text x="118" y="1223" font-size="25" fill="#8fa6c4" letter-spacing="1">简单任务要花 7–10 倍 token——统一预算次优，给思考长度设上限</text>
  </g>

  <!-- ================= 右侧：单问题 → 多路采样 → 验证器门 → 最优答案 ================= -->
  <!-- 问题节点 -->
  <circle cx="1560" cy="740" r="34" fill="#12294a" stroke="#7fdbff" stroke-width="3"/>
  <text x="1560" y="750" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">问题</text>

  <!-- 扇出连线 -->
  <g stroke="#4fc3f7" stroke-opacity="0.45" stroke-width="2.5">
    <line x1="1560" y1="740" x2="1830" y2="540"/>
    <line x1="1560" y1="740" x2="1830" y2="628"/>
    <line x1="1560" y1="740" x2="1830" y2="716"/>
    <line x1="1560" y1="740" x2="1830" y2="804"/>
    <line x1="1560" y1="740" x2="1830" y2="892"/>
    <line x1="1560" y1="740" x2="1830" y2="980"/>
  </g>

  <!-- 采样路径节点：通过 2 条 -->
  <g fill="#123252" stroke="#4fc3f7" stroke-width="3">
    <circle cx="1830" cy="628" r="20"/>
    <circle cx="1830" cy="804" r="20"/>
  </g>
  <!-- 落选 4 条 -->
  <g fill="#101d33" stroke="#55708f" stroke-width="2" stroke-dasharray="6 5">
    <circle cx="1830" cy="540" r="20"/>
    <circle cx="1830" cy="716" r="20"/>
    <circle cx="1830" cy="892" r="20"/>
    <circle cx="1830" cy="980" r="20"/>
  </g>
  <g font-size="24" font-weight="700" fill="#55708f" text-anchor="middle">
    <text x="1830" y="549">×</text>
    <text x="1830" y="725">×</text>
    <text x="1830" y="901">×</text>
    <text x="1830" y="989">×</text>
  </g>

  <!-- 验证器门 -->
  <rect x="1995" y="520" width="34" height="480" rx="8" fill="#0e1c33" fill-opacity="0.5" stroke="#e0b060" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="2012" y="498" font-size="23" fill="#e0b060" text-anchor="middle" letter-spacing="2">验证器筛选</text>

  <!-- 落选路径止于门前 -->
  <g stroke="#55708f" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="6 7" fill="none" marker-end="url(#arrowGrey)">
    <path d="M 1852 540 L 1988 536"/>
    <path d="M 1852 716 L 1988 716"/>
    <path d="M 1852 892 L 1988 888"/>
    <path d="M 1852 980 L 1988 964"/>
  </g>
  <!-- 通过路径穿门 -->
  <g stroke="#4fc3f7" stroke-opacity="0.7" stroke-width="2.5" fill="none">
    <path d="M 1852 628 L 1993 648"/>
    <path d="M 1852 804 L 1993 784"/>
  </g>
  <!-- 门后汇入答案 -->
  <g fill="none" stroke="#4fc3f7" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 2029 652 C 2100 668, 2150 690, 2186 704"/>
    <path d="M 2029 780 C 2100 764, 2150 742, 2186 728"/>
  </g>

  <!-- 最优答案节点 -->
  <circle cx="2240" cy="716" r="110" fill="url(#glowCyan)"/>
  <circle cx="2240" cy="716" r="52" fill="#0e2a4a" stroke="#7fdbff" stroke-width="3"/>
  <text x="2240" y="708" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">最优</text>
  <text x="2240" y="744" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">答案</text>
  <text x="2240" y="846" font-size="23" fill="#7fa8cc" text-anchor="middle">奖励模型 · 多数投票 · 单元测试</text>

  <!-- 主流程流动光点 -->
  <circle r="6" fill="#9be8ff">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 1560 740 L 1830 628 L 1995 648 L 2240 716"/>
  </circle>

  <!-- 面板底注 -->
  <text x="1930" y="1140" font-size="24" fill="#7fa8cc" text-anchor="middle" letter-spacing="1">多路并行采样 · 验证器筛出正确路径</text>

  <!-- ================= 底部信息条（边距 80 内） ================= -->
  <line x1="80" y1="1330" x2="2480" y2="1330" stroke="#16283f" stroke-width="1.5" opacity="0.9"/>
  <text x="80" y="1385" font-size="27" fill="#55708f" letter-spacing="2">数学与代码可自动判对错 · 开放任务缺裁判易饱和</text>
  <text x="2480" y="1385" font-size="27" fill="#55708f" text-anchor="end" letter-spacing="2">先并行后串行 · 给思考长度设上限</text>

  <!-- 右上角文献标注 -->
  <text x="2480" y="168" font-size="23" fill="#7c93ad" text-anchor="end" letter-spacing="3">SNELL 2024 · O1 · R1 · S1</text>
</svg>