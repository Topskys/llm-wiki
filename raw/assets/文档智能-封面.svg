    <rect x="1360" y="1030" width="190" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.04" stroke="#D8E6EF" stroke-opacity="0.35" stroke-width="2"/>
    <text x="1455" y="1067" text-anchor="middle" fill="#EAF3FA">精度评估</text>
