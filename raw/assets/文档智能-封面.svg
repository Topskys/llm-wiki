    <text x="700" y="816" font-size="42" font-weight="800" fill="#FFFFFF">理解</text>
    <text x="830" y="810" font-size="24" fill="#D8E6EF">语义 · 字段 · 关系</text>

    <line x1="1115" y1="775" x2="1178" y2="775" stroke="#D8E6EF" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M 1178 775 l -14 -8 v 16 Z" fill="#D8E6EF" fill-opacity="0.65"/>

    <rect x="1190" y="700" width="440" height="150" rx="20" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2.5"/>
    <rect x="1190" y="700" width="440" height="6" rx="3" fill="#F5C451"/>
    <text x="1230" y="762" font-size="22" font-weight="800" letter-spacing="2" fill="#F5C451">03</text>
    <text x="1230" y="816" font-size="42" font-weight="800" fill="#FFFFFF">校验</text>
    <text x="1362" y="810" font-size="24" fill="#D8E6EF">置信度 · 溯源 · 规则</text>

    <line x1="1645" y1="775" x2="1708" y2="775" stroke="#D8E6EF" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M 1708 775 l -14 -8 v 16 Z" fill="#D8E6EF" fill-opacity="0.65"/>

    <rect x="1720" y="700" width="440" height="150" rx="20" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2.5"/>
    <rect x="1720" y="700" width="440" height="6" rx="3" fill="#57D08B"/>
    <text x="1760" y="762" font-size="22" font-weight="800" letter-spacing="2" fill="#57D08B">04</text>
    <text x="1760" y="816" font-size="42" font-weight="800" fill="#FFFFFF">驱动</text>
    <text x="1890" y="810" font-size="24" fill="#D8E6EF">Schema · 集成 · 编排</text>
