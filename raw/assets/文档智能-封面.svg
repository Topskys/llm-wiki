<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12293F"/>
      <stop offset="100%" stop-color="#1C3D5A"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <radialGradient id="gridMask" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#7ED4F2" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <mask id="gridFade">
      <rect width="2560" height="1440" fill="url(#gridMask)"/>
    </mask>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>
  <rect width="2560" height="1440" fill="url(#grid)" mask="url(#gridFade)"/>

  <circle cx="2130" cy="230" r="330" fill="none" stroke="#7ED4F2" stroke-opacity="0.28" stroke-width="2.5"/>
  <circle cx="2380" cy="720" r="150" fill="none" stroke="#F5B27A" stroke-opacity="0.40" stroke-width="2.5"/>
  <circle cx="2020" cy="620" r="17" fill="#7ED4F2"/>
  <circle cx="2280" cy="150" r="9" fill="#F5B27A" fill-opacity="0.7"/>

  <text x="130" y="190" font-size="28" font-weight="800" letter-spacing="7" fill="#7ED4F2">DOCUMENT  INTELLIGENCE</text>

  <text x="126" y="360" font-size="130" font-weight="800" letter-spacing="6" fill="#FFFFFF">文档智能</text>
  <rect x="132" y="408" width="220" height="7" rx="3.5" fill="#7ED4F2"/>

  <text x="130" y="498" font-size="38" fill="#EAF3FA">把非结构化文档转成</text>
  <text x="478" y="498" font-size="38" font-weight="700" fill="#FFC98F">机器可理解、可校验、可驱动业务动作</text>
  <text x="1132" y="498" font-size="38" fill="#EAF3FA">的结构化数据</text>
  <text x="130" y="556" font-size="30" fill="#C2D5E2">本质是四段能力链，而非 OCR 的精度升级</text>

