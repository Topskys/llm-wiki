<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" role="img" aria-labelledby="cv-title cv-desc" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif">
  <title id="cv-title">正则化 · 防过拟合封面</title>
  <desc id="cv-desc">以 L1 菱形 / L2 球面的参数约束几何为主视觉，展示偏差-方差权衡：加约束压低有效复杂度，换取方差大降、学通用规律而非死记噪声。</desc>

  <defs>
    <radialGradient id="gTL" cx="0.12" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#1d2a4a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1d2a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBR" cx="0.85" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#3a1d2e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a1d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#e2edfd"/>
      <stop offset="1" stop-color="#c9ddfa"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ballGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c93ad"/>
    </marker>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="2560" height="1440" fill="#15203a"/>
  <rect width="2560" height="1440" fill="url(#gTL)"/>
  <rect width="2560" height="1440" fill="url(#gBR)"/>
  <g stroke="#2a3c5e" stroke-width="1.5" opacity="0.6">
    <line x1="240" y1="0" x2="240" y2="1440"/><line x1="480" y1="0" x2="480" y2="1440"/>
    <line x1="720" y1="0" x2="720" y2="1440"/><line x1="960" y1="0" x2="960" y2="1440"/>
    <line x1="1200" y1="0" x2="1200" y2="1440"/><line x1="1440" y1="0" x2="1440" y2="1440"/>
    <line x1="1680" y1="0" x2="1680" y2="1440"/><line x1="1920" y1="0" x2="1920" y2="1440"/>
    <line x1="2160" y1="0" x2="2160" y2="1440"/><line x1="2400" y1="0" x2="2400" y2="1440"/>
    <line x1="0" y1="240" x2="2560" y2="240"/><line x1="0" y1="480" x2="2560" y2="480"/>
    <line x1="0" y1="720" x2="2560" y2="720"/><line x1="0" y1="960" x2="2560" y2="960"/>
    <line x1="0" y1="1200" x2="2560" y2="1200"/>
  </g>

  <!-- ===== 顶部：标题区 ===== -->
  <text x="160" y="150" font-size="24" letter-spacing="4" fill="#7c93ad">机器学习 · 泛化理论 · REGULARIZATION</text>
  <text x="160" y="300" font-weight="bold" font-size="120" letter-spacing="6" fill="url(#titleGrad)">正则化</text>
  <text x="160" y="390" font-size="38" fill="#cbd5e1">加约束 · 限复杂度 · 降方差 —— 学通用规律，不记噪声</text>

  <!-- 右上：正则化核心公式徽章 -->
  <g filter="url(#cardShadow)">
    <rect x="1830" y="225" width="560" height="80" rx="40" fill="#0f2e3a" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <text x="2110" y="279" text-anchor="middle" font-size="30" font-weight="bold" letter-spacing="1" fill="#7dd3fc">min L(w) + λ·Ω(w)</text>

  <!-- ===== 左主视觉：L1 菱形约束几何 ===== -->
  <text x="520" y="620" text-anchor="middle" font-size="26" letter-spacing="2" fill="#7c93ad">L1 菱形约束 → 稀疏</text>
  <g transform="translate(520,760) scale(0.8)">
    <polygon points="0,-260 260,0 0,260 -260,0" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.95"/>
    <ellipse cx="-70" cy="-40" rx="150" ry="95" fill="none" stroke="#4b5b74" stroke-width="3" stroke-dasharray="10 8" opacity="0.9"/>
    <ellipse cx="-100" cy="-15" rx="210" ry="135" fill="none" stroke="#3a4a63" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.7"/>
    <line x1="-330" y1="0" x2="330" y2="0" stroke="#24344b" stroke-width="2"/>
    <line x1="0" y1="-330" x2="0" y2="330" stroke="#24344b" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="url(#ballGrad)" filter="url(#nodeGlow)"/>
    <text x="0" y="-318" text-anchor="middle" font-size="22" fill="#7dd3fc">交点落于尖角 → w=0</text>
  </g>

  <!-- ===== 右主视觉：L2 球面约束几何 ===== -->
  <text x="1280" y="620" text-anchor="middle" font-size="26" letter-spacing="2" fill="#7c93ad">L2 球面约束 → 均匀缩小</text>
  <g transform="translate(1280,760) scale(0.8)">
    <circle r="260" fill="none" stroke="#f59e0b" stroke-width="5" opacity="0.95"/>
    <ellipse cx="60" cy="-50" rx="150" ry="95" fill="none" stroke="#4b5b74" stroke-width="3" stroke-dasharray="10 8" opacity="0.9"/>
    <ellipse cx="90" cy="-80" rx="210" ry="135" fill="none" stroke="#3a4a63" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.7"/>
    <line x1="-330" y1="0" x2="330" y2="0" stroke="#24344b" stroke-width="2"/>
    <line x1="0" y1="-330" x2="0" y2="330" stroke="#24344b" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="#fbbf24" filter="url(#nodeGlow)"/>
    <text x="0" y="-318" text-anchor="middle" font-size="22" fill="#fcd34d">交点难落轴 → w 整体变小</text>
  </g>

  <!-- ===== 右中：损失等高线示意 ===== -->
  <text x="2040" y="620" text-anchor="middle" font-size="26" letter-spacing="2" fill="#7c93ad">偏差-方差权衡</text>
  <g transform="translate(2040,760) scale(0.8)">
    <g stroke="#36507a" stroke-width="3" fill="none">
      <ellipse rx="90" ry="70"/><ellipse rx="150" ry="115"/>
      <ellipse rx="210" ry="160" opacity="0.8"/><ellipse rx="270" ry="205" opacity="0.6"/>
    </g>
    <line x1="-300" y1="0" x2="300" y2="0" stroke="#24344b" stroke-width="2"/>
    <line x1="0" y1="-300" x2="0" y2="300" stroke="#24344b" stroke-width="2"/>
    <circle cx="0" cy="0" r="11" fill="#fde047" filter="url(#nodeGlow)"/>
    <circle cx="180" cy="-120" r="9" fill="#38bdf8" opacity="0.9"/>
    <text x="0" y="-315" text-anchor="middle" font-size="22" fill="#fde047">全局最优（易过拟合）</text>
    <text x="185" y="-145" text-anchor="middle" font-size="20" fill="#7dd3fc">正则解</text>
  </g>

  <!-- ===== 底部：方法谱系 ===== -->
  <g filter="url(#cardShadow)">
    <rect x="160" y="1070" width="2240" height="250" rx="20" fill="#0e1830" stroke="#24344b" stroke-width="2"/>
  </g>
  <text x="200" y="1130" font-size="27" font-weight="bold" letter-spacing="2" fill="#c9ddfa">四类技术路线</text>

  <circle cx="220" cy="1205" r="7" fill="#38bdf8"/>
  <text x="248" y="1215" font-size="25" fill="#a5b4c8">参数约束　L1 / L2 / L0 / 弹性网络　·　特征需先标准化</text>
  <circle cx="220" cy="1252" r="7" fill="#f59e0b"/>
  <text x="248" y="1262" font-size="25" fill="#a5b4c8">结构干预　Dropout · 早停 · 批归一化 · 权重约束 · 标签平滑</text>
  <circle cx="1220" cy="1205" r="7" fill="#6366f1"/>
  <text x="1248" y="1215" font-size="25" fill="#a5b4c8">数据扩充　数据增强 · 噪声注入 · 合成更多数据</text>
  <circle cx="1220" cy="1252" r="7" fill="#f472b6"/>
  <text x="1248" y="1262" font-size="25" fill="#a5b4c8">集成与结构　Bagging · 限制宽度深度 · 决策树剪枝</text>

  <text x="160" y="1360" font-size="22" letter-spacing="6" fill="#3d5674">CONSTRAIN · SIMPLIFY · REDUCE VARIANCE · GENERALIZE</text>
</svg>