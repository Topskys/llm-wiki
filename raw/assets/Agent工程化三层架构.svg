<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 2580 1460" width="2560" height="1440" role="img" aria-labelledby="cv-title cv-desc" font-family="'PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif">
  <title id="cv-title">Agent 工程化三层架构封面</title>
  <desc id="cv-desc">主视觉为编排、隔离、运维三层堆叠：编排层内嵌 Harness 五阶段循环回路，隔离层为四档沙箱信任阶梯，运维层为追踪三轴与 Durable Execution；层间箭头表达副作用下传与健康信号反馈。</desc>

  <defs>
    <radialGradient id="gTL" cx="0.12" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#1e3a5f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBR" cx="0.85" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#0e3a2e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e3a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#e2edfd"/>
      <stop offset="1" stop-color="#c9ddfa"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-80%" width="180%" height="260%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ===== 背景：全幅铺满 ===== -->
  <rect width="2560" height="1440" fill="#0a1220"/>
  <rect width="2560" height="1440" fill="url(#gTL)"/>
  <rect width="2560" height="1440" fill="url(#gBR)"/>
  <g stroke="#16283f" stroke-width="1.5" opacity="0.6">
    <line x1="240" y1="0" x2="240" y2="1440"/><line x1="480" y1="0" x2="480" y2="1440"/>
    <line x1="720" y1="0" x2="720" y2="1440"/><line x1="960" y1="0" x2="960" y2="1440"/>
    <line x1="1200" y1="0" x2="1200" y2="1440"/><line x1="1440" y1="0" x2="1440" y2="1440"/>
    <line x1="1680" y1="0" x2="1680" y2="1440"/><line x1="1920" y1="0" x2="1920" y2="1440"/>
    <line x1="2160" y1="0" x2="2160" y2="1440"/><line x1="2400" y1="0" x2="2400" y2="1440"/>
    <line x1="0" y1="240" x2="2560" y2="240"/><line x1="0" y1="480" x2="2560" y2="480"/>
    <line x1="0" y1="720" x2="2560" y2="720"/><line x1="0" y1="960" x2="2560" y2="960"/>
    <line x1="0" y1="1200" x2="2560" y2="1200"/>
  </g>

  <!-- ===== 顶部：标题区 ===== -->
  <text x="80" y="145" font-size="24" letter-spacing="4" fill="#7c93ad">LLM AGENT · PRODUCTION ENGINEERING</text>
  <text x="80" y="300" font-weight="bold" font-size="104" letter-spacing="4" fill="url(#titleGrad)">Agent 工程化三层架构</text>
  <text x="80" y="395" font-size="36" fill="#cbd5e1">给不可靠的模型套上可靠约束 —— 编排管推进 · 隔离管边界 · 运维管可信</text>

  <!-- 右上：实证徽章 -->
  <g filter="url(#cardShadow)">
    <rect x="1900" y="150" width="580" height="110" rx="24" fill="#0f2e22" stroke="#34d399" stroke-width="2"/>
  </g>
  <circle cx="1940" cy="205" r="8" fill="#34d399"/>
  <text x="2210" y="192" text-anchor="middle" font-size="24" font-weight="bold" fill="#6ee7b7">实证 · 同一模型，换 Harness 配置</text>
  <text x="2210" y="232" text-anchor="middle" font-size="22" fill="#a7f3d0">SWE-bench 表现差异超 6 个百分点</text>

  <!-- ===== 层1：编排层 ===== -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="460" width="2400" height="210" rx="20" fill="#0f2138" stroke="#2b4a6e" stroke-width="2"/>
  </g>
  <text x="150" y="540" font-size="34" font-weight="bold" fill="#38bdf8">01</text>
  <text x="150" y="598" font-size="48" font-weight="bold" fill="#eaf2ff">编排层</text>
  <text x="150" y="638" font-size="18" letter-spacing="2" fill="#7c93ad">ORCHESTRATION</text>

  <!-- 循环回路（未命中终止 → 回到感知） -->
  <path d="M 1475 522 Q 1015 460 555 522" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="7 6"/>
  <polygon points="546,508 564,508 555,524" fill="#38bdf8" fill-opacity="0.8"/>
  <text x="1015" y="478" text-anchor="middle" font-size="17" fill="#5b8db8">未命中终止 · 循环</text>

  <g filter="url(#cardShadow)">
    <rect x="460" y="530" width="190" height="60" rx="12" fill="#123049" stroke="#2b4a6e" stroke-width="1.5"/>
    <rect x="690" y="530" width="190" height="60" rx="12" fill="#123049" stroke="#2b4a6e" stroke-width="1.5"/>
    <rect x="920" y="530" width="190" height="60" rx="12" fill="#123049" stroke="#2b4a6e" stroke-width="1.5"/>
    <rect x="1150" y="530" width="190" height="60" rx="12" fill="#123049" stroke="#2b4a6e" stroke-width="1.5"/>
    <rect x="1380" y="530" width="190" height="60" rx="12" fill="#123049" stroke="#2b4a6e" stroke-width="1.5"/>
    <rect x="1610" y="530" width="230" height="60" rx="12" fill="#0f2e22" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <text x="555" y="568" text-anchor="middle" font-size="21" fill="#d7e6fa">Perceive 感知</text>
  <text x="785" y="568" text-anchor="middle" font-size="21" fill="#d7e6fa">Reason 推理</text>
  <text x="1015" y="568" text-anchor="middle" font-size="21" fill="#d7e6fa">Plan 规划</text>
  <text x="1245" y="568" text-anchor="middle" font-size="21" fill="#d7e6fa">Act 执行</text>
  <text x="1475" y="568" text-anchor="middle" font-size="21" fill="#d7e6fa">Observe 观察</text>
  <text x="1725" y="568" text-anchor="middle" font-size="20" font-weight="bold" fill="#6ee7b7">Terminate 退出</text>
  <text x="672" y="568" text-anchor="middle" font-size="26" fill="#5b7ca3">→</text>
  <text x="902" y="568" text-anchor="middle" font-size="26" fill="#5b7ca3">→</text>
  <text x="1132" y="568" text-anchor="middle" font-size="26" fill="#5b7ca3">→</text>
  <text x="1362" y="568" text-anchor="middle" font-size="26" fill="#5b7ca3">→</text>
  <text x="1592" y="568" text-anchor="middle" font-size="26" fill="#5b7ca3">→</text>

  <text x="2480" y="568" text-anchor="end" font-size="28" fill="#93c5fd">「怎么循环推进」</text>
  <text x="460" y="650" font-size="21" fill="#7c93ad">幂等防御 L1–L4 · 终止条件五路熔断 · token / 步数 / 时间 / 金额 四维预算 · 无进展检测断路器</text>

  <!-- 缝隙箭头：编排 → 隔离 -->
  <line x1="2380" y1="676" x2="2380" y2="718" stroke="#5b7ca3" stroke-width="2.5"/>
  <polygon points="2372,716 2388,716 2380,730" fill="#5b7ca3"/>
  <text x="2345" y="706" text-anchor="end" font-size="20" fill="#7c93ad">Act 带副作用</text>

  <!-- ===== 层2：隔离层 ===== -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="730" width="2400" height="210" rx="20" fill="#0f2138" stroke="#3f3a6e" stroke-width="2"/>
  </g>
  <text x="150" y="800" font-size="34" font-weight="bold" fill="#a78bfa">02</text>
  <text x="150" y="858" font-size="48" font-weight="bold" fill="#eaf2ff">隔离层</text>
  <text x="150" y="898" font-size="18" letter-spacing="2" fill="#7c93ad">ISOLATION</text>

  <text x="1045" y="768" text-anchor="middle" font-size="18" fill="#7c93ad">← 隔离递增 →</text>
  <g filter="url(#cardShadow)">
    <rect x="460" y="790" width="270" height="60" rx="12" fill="#171538" stroke="#4a4380" stroke-width="1.5"/>
    <rect x="760" y="790" width="270" height="60" rx="12" fill="#171538" stroke="#4a4380" stroke-width="1.5"/>
    <rect x="1060" y="790" width="270" height="60" rx="12" fill="#171538" stroke="#4a4380" stroke-width="1.5"/>
    <rect x="1360" y="790" width="270" height="60" rx="12" fill="#171538" stroke="#4a4380" stroke-width="1.5"/>
  </g>
  <text x="595" y="828" text-anchor="middle" font-size="21" fill="#e3defa">T1 Wasm 组件</text>
  <text x="895" y="828" text-anchor="middle" font-size="21" fill="#e3defa">T2 容器</text>
  <text x="1195" y="828" text-anchor="middle" font-size="21" fill="#e3defa">T3 gVisor 硬化容器</text>
  <text x="1495" y="828" text-anchor="middle" font-size="21" fill="#e3defa">T4 microVM</text>
  <text x="745" y="828" text-anchor="middle" font-size="26" fill="#6d63a8">→</text>
  <text x="1045" y="828" text-anchor="middle" font-size="26" fill="#6d63a8">→</text>
  <text x="1345" y="828" text-anchor="middle" font-size="26" fill="#6d63a8">→</text>

  <text x="2480" y="828" text-anchor="end" font-size="28" fill="#c4b5fd">「能碰什么」</text>
  <text x="460" y="918" font-size="21" fill="#7c93ad">权限四档 Auto / Log-only / Human approval / Blocked · 不可逆操作必人审 · 审批超时默认 deny · 绕过审批仅在沙箱边界之后</text>

  <!-- 缝隙箭头：隔离 → 运维 与 运维 -.-> 反馈 -->
  <line x1="2380" y1="946" x2="2380" y2="988" stroke="#5b7ca3" stroke-width="2.5"/>
  <polygon points="2372,986 2388,986 2380,1000" fill="#5b7ca3"/>
  <text x="2345" y="976" text-anchor="end" font-size="20" fill="#7c93ad">产生 trace 与状态</text>
  <line x1="180" y1="994" x2="180" y2="952" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.8"/>
  <polygon points="172,954 188,954 180,940" fill="#34d399" opacity="0.85"/>
  <text x="210" y="978" font-size="20" fill="#4f9a7d">健康信号反馈</text>

  <!-- ===== 层3：运维层 ===== -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="1000" width="2400" height="210" rx="20" fill="#0f2138" stroke="#1e5a45" stroke-width="2"/>
  </g>
  <text x="150" y="1060" font-size="34" font-weight="bold" fill="#34d399">03</text>
  <text x="150" y="1118" font-size="48" font-weight="bold" fill="#eaf2ff">运维层</text>
  <text x="150" y="1158" font-size="18" letter-spacing="2" fill="#7c93ad">OPERATIONS</text>

  <g filter="url(#cardShadow)">
    <rect x="460" y="1050" width="330" height="60" rx="12" fill="#10302a" stroke="#2a6b58" stroke-width="1.5"/>
    <rect x="820" y="1050" width="330" height="60" rx="12" fill="#10302a" stroke="#2a6b58" stroke-width="1.5"/>
    <rect x="1180" y="1050" width="330" height="60" rx="12" fill="#10302a" stroke="#2a6b58" stroke-width="1.5"/>
    <rect x="1560" y="1050" width="340" height="60" rx="12" fill="#0f2e22" stroke="#34d399" stroke-width="1.8"/>
  </g>
  <text x="625" y="1088" text-anchor="middle" font-size="21" fill="#d2f0e6">执行轴 · Span 树</text>
  <text x="985" y="1088" text-anchor="middle" font-size="21" fill="#d2f0e6">成本轴 · Token 归因</text>
  <text x="1345" y="1088" text-anchor="middle" font-size="21" fill="#d2f0e6">审计轴 · Append-only</text>
  <text x="1730" y="1088" text-anchor="middle" font-size="21" font-weight="bold" fill="#6ee7b7">Checkpoint ≠ Durable</text>
  <text x="1518" y="1088" text-anchor="middle" font-size="26" fill="#3f8a72">→</text>

  <text x="2480" y="1088" text-anchor="end" font-size="28" fill="#6ee7b7">「看得见，跑得久」</text>
  <text x="460" y="1188" font-size="21" fill="#7c93ad">LangGraph interrupt 暂停续跑 · node 边界即重放边界，副作用幂等兜底 · 定期 kill worker 演练恢复</text>

  <!-- ===== 底部：铁律（轻条） ===== -->
  <circle cx="92" cy="1262" r="7" fill="#fbbf24"/>
  <text x="124" y="1272" font-size="27" fill="#a5b4c8">实施铁律　幂等键派生自稳定上下文 · 不可逆操作必人审 · 审批超时默认 deny · 熔断止损而非仅告警</text>

  <text x="80" y="1360" font-size="22" letter-spacing="6" fill="#3d5674">ORCHESTRATE · CONTAIN · OBSERVE · RECOVER</text>
</svg>